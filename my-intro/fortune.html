<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 운세 — JYS의 페이지</title>
  <style>
    :root {
      --bg-deep: #07040f;
      --bg-mid: #150c2e;
      --bg-glow: #2b1a5c;
      --violet: #a678ff;
      --gold: #ffd79a;
      --gold-soft: #f0c987;
      --text: #e9e3ff;
      --text-dim: #9d94c4;
      --card-face: linear-gradient(160deg, #241546 0%, #150c2e 100%);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      padding: 48px 20px 72px;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 600px at 15% -10%, rgba(120, 70, 220, 0.45), transparent 60%),
        radial-gradient(700px 500px at 85% 10%, rgba(40, 130, 200, 0.30), transparent 60%),
        radial-gradient(800px 700px at 50% 110%, rgba(180, 80, 200, 0.25), transparent 60%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 55%, #0b0620 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* 별빛 배경 */
    .stars, .stars::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(1.4px 1.4px at 20% 30%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1.2px 1.2px at 70% 15%, rgba(255,235,200,0.8), transparent),
        radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.6px 1.6px at 85% 60%, rgba(200,220,255,0.85), transparent),
        radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.2px 1.2px at 55% 45%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 92% 35%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.3px 1.3px at 30% 12%, rgba(255,230,255,0.7), transparent);
      background-size: 100% 100%;
      animation: twinkle 5s ease-in-out infinite alternate;
    }
    .stars::after {
      transform: scale(1.7) rotate(20deg);
      opacity: 0.5;
      animation-duration: 8s;
      animation-direction: alternate-reverse;
    }

    @keyframes twinkle {
      from { opacity: 0.35; }
      to   { opacity: 0.9; }
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    .eyebrow {
      letter-spacing: 0.5em;
      font-size: 12px;
      color: var(--gold-soft);
      text-transform: uppercase;
      margin: 0 0 14px;
      opacity: 0.85;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 700;
      letter-spacing: -0.01em;
      background: linear-gradient(100deg, #fff 10%, var(--gold) 45%, var(--violet) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(166, 120, 255, 0.35);
    }

    .lead {
      margin: 0 auto 8px;
      max-width: 460px;
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.7;
    }

    .today {
      font-size: 13px;
      color: var(--gold-soft);
      opacity: 0.75;
      margin-bottom: 36px;
    }

    /* 카드 그리드 */
    .deck {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      perspective: 1400px;
      margin-bottom: 36px;
    }

    @media (max-width: 640px) {
      .deck { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      body { padding: 32px 16px 56px; }
    }

    .card {
      position: relative;
      aspect-ratio: 2 / 3;
      border: none;
      padding: 0;
      background: none;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease, filter 0.5s ease;
      animation: float 6s ease-in-out infinite;
    }
    .card:nth-child(2n) { animation-delay: -1.5s; }
    .card:nth-child(3n) { animation-delay: -3s; }
    .card:nth-child(4n) { animation-delay: -4.5s; }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50%      { translate: 0 -7px; }
    }

    .card:hover:not(:disabled) { transform: translateY(-10px) scale(1.04); }
    .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; border-radius: 16px; }

    .deck.revealed .card { animation-play-state: paused; pointer-events: none; }
    .deck.revealed .card:not(.chosen) { opacity: 0.22; filter: blur(1.5px) saturate(0.4); }
    .card.chosen { transform: rotateY(180deg) scale(1.06); z-index: 2; }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
    }

    .face-back {
      background:
        radial-gradient(circle at 50% 40%, rgba(166,120,255,0.35), transparent 62%),
        linear-gradient(155deg, #2c1a5e 0%, #170d33 55%, #241348 100%);
      border: 1px solid rgba(255, 215, 154, 0.35);
      box-shadow:
        0 12px 34px rgba(0, 0, 0, 0.55),
        inset 0 0 24px rgba(166, 120, 255, 0.25);
    }

    .face-back::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 215, 154, 0.22);
    }

    .sigil {
      font-size: clamp(26px, 6vw, 34px);
      color: var(--gold);
      text-shadow: 0 0 18px rgba(255, 215, 154, 0.6);
    }

    .sigil-sub {
      font-size: 11px;
      letter-spacing: 0.35em;
      color: rgba(255, 215, 154, 0.55);
      padding-left: 0.35em;
    }

    .face-front {
      transform: rotateY(180deg);
      background: var(--card-face);
      border: 1px solid rgba(255, 215, 154, 0.55);
      box-shadow:
        0 16px 44px rgba(0, 0, 0, 0.6),
        inset 0 0 30px rgba(255, 215, 154, 0.14);
      padding: 12px;
    }

    .face-front .emoji { font-size: clamp(30px, 7vw, 40px); }
    .face-front .rank {
      font-size: 13px;
      letter-spacing: 0.18em;
      color: var(--gold);
    }
    .face-front .name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    /* 결과 패널 */
    .result {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.6s ease 0.45s, transform 0.6s ease 0.45s;
      pointer-events: none;
      border-radius: 20px;
      padding: 30px 26px;
      text-align: left;
      background: linear-gradient(150deg, rgba(48, 28, 92, 0.72), rgba(16, 9, 38, 0.82));
      border: 1px solid rgba(255, 215, 154, 0.3);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(166, 120, 255, 0.12);
      backdrop-filter: blur(6px);
    }
    .result.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

    .result-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .result-emoji { font-size: 40px; }
    .result-rank {
      font-size: 12px;
      letter-spacing: 0.24em;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .result-name {
      font-size: clamp(20px, 4.5vw, 26px);
      font-weight: 700;
      margin: 0;
    }
    .result-msg {
      font-size: 16px;
      line-height: 1.85;
      color: var(--text);
      margin: 0 0 22px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      border-top: 1px solid rgba(255, 215, 154, 0.18);
      padding-top: 18px;
    }
    @media (max-width: 480px) {
      .meta { grid-template-columns: 1fr; text-align: center; }
    }
    .meta div span {
      display: block;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .meta div strong {
      font-size: 15px;
      color: var(--gold-soft);
      font-weight: 600;
    }

    .again {
      margin-top: 28px;
      padding: 13px 30px;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 0.08em;
      color: var(--gold);
      background: rgba(255, 215, 154, 0.06);
      border: 1px solid rgba(255, 215, 154, 0.45);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }
    .again:hover {
      background: rgba(255, 215, 154, 0.16);
      box-shadow: 0 0 26px rgba(255, 215, 154, 0.3);
      transform: translateY(-2px);
    }

    .footer-link {
      display: block;
      margin-top: 34px;
      font-size: 13px;
      color: var(--text-dim);
      text-decoration: none;
      opacity: 0.7;
    }
    .footer-link:hover { color: var(--gold-soft); opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .card, .stars, .stars::after { animation: none; }
      .card, .result { transition-duration: 0.01ms; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <main class="wrap">
    <p class="eyebrow">Today's Fortune</p>
    <h1>오늘의 운세</h1>
    <p class="lead">마음을 가라앉히고, 눈길이 머무는 카드 한 장을 골라보세요.<br>당신을 기다리는 오늘의 메시지가 담겨 있습니다.</p>
    <p class="today" id="today"></p>

    <div class="deck" id="deck"></div>

    <section class="result" id="result" aria-live="polite">
      <div class="result-head">
        <div class="result-emoji" id="rEmoji"></div>
        <div>
          <div class="result-rank" id="rRank"></div>
          <h2 class="result-name" id="rName"></h2>
        </div>
      </div>
      <p class="result-msg" id="rMsg"></p>
      <div class="meta">
        <div><span>행운의 색</span><strong id="rColor"></strong></div>
        <div><span>행운의 숫자</span><strong id="rNumber"></strong></div>
        <div><span>오늘의 키워드</span><strong id="rKeyword"></strong></div>
      </div>
      <button class="again" id="again" type="button">다시 뽑기</button>
    </section>

    <a class="footer-link" href="index.html">← JYS의 페이지로 돌아가기</a>
  </main>

  <script>
    const FORTUNES = [
      {
        emoji: "☀️", rank: "대길 大吉", name: "태양의 카드",
        msg: "가려져 있던 것이 환하게 드러나는 날입니다. 미뤄두었던 이야기를 꺼내기에 더없이 좋은 때예요. 오늘 당신이 먼저 건네는 한마디가 생각보다 멀리까지 닿습니다.",
        color: "선명한 골드", number: 1, keyword: "자신감"
      },
      {
        emoji: "🌙", rank: "중길 中吉", name: "달의 카드",
        msg: "직감이 유난히 예민해지는 하루입니다. 서두르지 말고 마음이 보내는 신호를 따라가 보세요. 답은 이미 당신 안에 조용히 놓여 있습니다.",
        color: "은은한 실버", number: 7, keyword: "직관"
      },
      {
        emoji: "⭐", rank: "길 吉", name: "별의 카드",
        msg: "작게 품어온 바람이 현실 쪽으로 한 걸음 다가옵니다. 오늘 세운 계획은 흔들리지 않으니, 마음속 목록의 첫 줄부터 적어보세요.",
        color: "깊은 인디고", number: 3, keyword: "희망"
      },
      {
        emoji: "🔥", rank: "대길 大吉", name: "불꽃의 카드",
        msg: "에너지가 넘치는 날, 망설임이 가장 큰 손해입니다. 하고 싶었던 일에 바로 손을 대세요. 시작하는 순간 흐름이 당신 편으로 기웁니다.",
        color: "따뜻한 오렌지", number: 9, keyword: "실행"
      },
      {
        emoji: "🌊", rank: "중길 中吉", name: "물결의 카드",
        msg: "흐름에 맡길수록 편안해지는 하루입니다. 붙잡으려 애쓰던 것을 잠시 놓아보세요. 감정이 잔잔해지면 관계도 자연스럽게 제자리를 찾습니다.",
        color: "맑은 아쿠아", number: 5, keyword: "여유"
      },
      {
        emoji: "🌿", rank: "길 吉", name: "새싹의 카드",
        msg: "눈에 띄지 않아도 분명히 자라고 있습니다. 오늘의 성실함은 반드시 기록으로 남으니, 결과를 재촉하지 말고 한 걸음만 더 나아가세요.",
        color: "부드러운 그린", number: 4, keyword: "성장"
      },
      {
        emoji: "🗝️", rank: "길 吉", name: "열쇠의 카드",
        msg: "닫혀 있다고 여겼던 문 앞에 기회가 놓입니다. 우연한 연락이나 낯선 제안을 흘려보내지 마세요. 오늘의 만남이 다음 장을 열어줍니다.",
        color: "고요한 퍼플", number: 8, keyword: "기회"
      },
      {
        emoji: "🕊️", rank: "소길 小吉", name: "새의 카드",
        msg: "무리하지 않아도 되는 날입니다. 오늘은 비우는 쪽이 이득이니, 일정 하나쯤은 덜어내세요. 쉬어가는 자리에서 다음 방향이 보입니다.",
        color: "은은한 화이트", number: 6, keyword: "휴식"
      }
    ];

    const deck = document.getElementById("deck");
    const result = document.getElementById("result");

    const now = new Date();
    document.getElementById("today").textContent =
      `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 · 8장 중 한 장`;

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function reveal(card, fortune) {
      if (deck.classList.contains("revealed")) return;

      deck.classList.add("revealed");
      card.classList.add("chosen");
      card.setAttribute("aria-label", `${fortune.name} — ${fortune.rank}`);

      document.getElementById("rEmoji").textContent = fortune.emoji;
      document.getElementById("rRank").textContent = fortune.rank;
      document.getElementById("rName").textContent = fortune.name;
      document.getElementById("rMsg").textContent = fortune.msg;
      document.getElementById("rColor").textContent = fortune.color;
      document.getElementById("rNumber").textContent = fortune.number;
      document.getElementById("rKeyword").textContent = fortune.keyword;

      result.classList.add("show");
      setTimeout(() => result.scrollIntoView({ behavior: "smooth", block: "nearest" }), 700);
    }

    function dealCards() {
      deck.classList.remove("revealed");
      result.classList.remove("show");
      deck.innerHTML = "";

      shuffle(FORTUNES).forEach((fortune, i) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.setAttribute("aria-label", `${i + 1}번 카드 뽑기`);
        card.innerHTML = `
          <div class="face face-back">
            <div class="sigil">✦</div>
            <div class="sigil-sub">FORTUNE</div>
          </div>
          <div class="face face-front">
            <div class="emoji">${fortune.emoji}</div>
            <div class="rank">${fortune.rank}</div>
            <div class="name">${fortune.name}</div>
          </div>`;
        card.addEventListener("click", () => reveal(card, fortune));
        deck.appendChild(card);
      });
    }

    document.getElementById("again").addEventListener("click", () => {
      dealCards();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    dealCards();
  </script>
</body>
</html>
